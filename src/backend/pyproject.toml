[project]
name = "viral-images-backend"
version = "0.1.0"
description = "Clusters of reprinted images from the Newspaper Navigator dataset"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162",
    "uvicorn[standard]>=0.54",
    "pydantic-settings>=2.16",
    "pandas>=3.1",
    "pyarrow>=26",
]

[dependency-groups]
# Only needed at image build time to run core/preprocess_dataset.py
preprocess = [
    "datasets>=5.1",
    "pandas>=3.1",
    "pyarrow>=26",
]

[tool.uv]
package = false
