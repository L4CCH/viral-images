services:
  backend:
    build:
      context: .
      dockerfile: ./src/backend/Dockerfile.backend
    image: viral-images-backend
    container_name: viral-images-backend
    profiles:
      - backend
      - full
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    # The processed dataset is baked into the image at /data. Don't mount a
    # volume there, or rebuilt images would keep serving the old dataset.
    networks:
      - viral-images-network
    deploy:
      resources:
        # Mirrors production (App Runner: 0.5 vCPU / 1 GB); the app uses ~330 MiB
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          memory: 512M
    restart: unless-stopped
    # Live reload during development: `docker compose --profile backend watch`
    develop:
      watch:
        - action: sync+restart
          path: ./src/backend
          target: /app
          ignore:
            - __pycache__/
            - .venv/
            - pyproject.toml
            - uv.lock
        - action: rebuild
          path: ./src/backend/uv.lock

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile.frontend
    image: viral-images-frontend-dev
    container_name: viral-images-frontend
    profiles:
      - frontend
      - full
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./src/frontend:/app
      - /app/node_modules
      - /app/.next
    # Set NEXT_PUBLIC_API_BASE_PATH (e.g. http://localhost:8000/api) here
    env_file:
      - path: ./src/frontend/.env.local
        required: false
    networks:
      - viral-images-network
    depends_on:
      backend:
        condition: service_healthy
        required: false  # Lets the frontend profile start without the backend
    restart: unless-stopped

networks:
  viral-images-network:
    name: viral-images-network
